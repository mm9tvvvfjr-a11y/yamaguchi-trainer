ействия.", "Цена": "820.000", "Ключевая характеристика": "Массажное кресло  с удлиненной J-образной кареткой, которая позволяет делать массаж от  головы до подколенной зоны. Кресло со стальной рамой и стальным характером, способное сделать самый интенсивный 4д массаж.", "Основные отличительные особенности": "Удлиненная наверх J-образная каретка - выполняет цервико-карниальный массаж - массаж затылочной части головы и шейно-воротниковой зоны и вытяжение шейного отдела позвоночника.\nМассажный 4D-механизм - массирует даже глубокие мышцы, выполняет вытяжение позвоночника (прогиб)\nУсовершенствованный механизм подставки для ног из 42 аэроподушек с быстрым прогревом в области икр и подвижной частью для массажа коленей осуществляет глубокий  массаж ног.", "Вытяжение позвоночника": "Есть", "Управление": "8-дюймовый сенсорный планшет, джойстик", "Количество воздушно-компрессионных подушек (Лимфодренажный массаж)": "64 (3D Push Air)", "Графеновая технология прогрева/инфракрасная система прогрева": "Инфракрасный", "Прогреваемые зоны": "Спина, голени", "Режим невесомости (Zero-G/X-Space)": "ZERO-G ( 144, 149 и 152 градуса)", "Количество программ": "12 авт и 6 ручн", "Тип каретки": "J-образная каретка", "Cветотерапия": "Есть", "Тенология экономии пространства SmartSlide (8 см от стены)": "Нет", "USB-порт/Беспроводная зарядка": "Беспроводная зарядка/USB", "Расцветки": "1 (беж дерево)", "Размеры в сложенном виде (Г/В/Ш)": "159х117,5х81", "Размеры в разложенном виде (Г/В/Ш)": "180х111х81"}}, {"id": "J", "name": "Jet", "img": "data:image/webp;base64,UklGRlYyAABXRUJQVlA4IEoyAACQAQGdASqjAaQBPnk2mEmkoqKqo1EbWVAPCWdu/AkYTMuuxlRDa5IFgz1L/Mt5pnnOelv1UG9RWppzW/Z+KvoW+lzUTjf53+i/6frM7beAj7L/13D4gH/Sf7x/2PS7nSZAXDAew+wP+rvWE/0/LB9fewf+xvWn/dX//+6x+4xVn8VYE1CyKTxGVLX2iQF5W/eyz3cs9v6jO0qJRyD2WN3LJgKwPOhoVsf/GIaESD1ri3WecXUh5rWR1F7PD7AQACgD+Y1/oHh2EzMaqKYmMxxpM1JHxkiJNbYzY3s3MdXE5BF1NhvwMRRNSJ5xdSHmtJq/sle9GLgPpeTMj+7DSKnK3qoXrJ0I60WuzYf51lx41Pz6nXiEvMRNNyck1CyKV5WELflzIB/QgFoVMl5xf5hKE6X839lI function chairByOpt(t){const s=String(t).trim().toLowerCase();return CH.find(c=>c.name.toLowerCase()===s)||null}
function stemChair(txt){for(const [a,n,ci] of ALIAS){const re=new RegExp('(?:^|[^\\w-])('+a+')(?![\\w-])',ci?'i':'');const m=txt.match(re);if(m){const c=CH.find(c=>c.name===n);if(c)return{c,nm:m[1]}}}return null}
function factFor(q){if(q.type!=='single')return null;
 if(/не относится/i.test(q.q)){const sc=stemChair(q.q),c=sc&&sc.c;return c?{kind:'odd',c,nm:sc.nm,label:'главное в модели',text:keyText(c,260)}:null}
 if(q.correct.length!==1)return null;const o=q.opts.find(x=>x.k===q.correct[0]),c=o&&chairByOpt(o.t);if(!c)return null;
 const nums=(q.q.match(/\d+/g)||[]);
 for(const [re,key,label] of TOPICS){if(re.test(q.q)){const v=oneLine(c.rows[key]);if(v&&nums.every(x=>v.includes(x)))return{kind:'row',c,nm:o.t,label,text:v.length>240?v.slice(0,239)+'…':v}}}
 const qs=stems(q.q);let best='',bs=0;
 ['Основные отличительные особенности','ПОЧЕМУ?','Ключевая характеристика'].forEach(k=>String(c.rows[k]||'').replace(/([.!?])\s+/g,'$1\n').split('\n').forEach(s=>{s=s.trim();if(s.length<20)return;const ss=stems(s),sc=qs.filter(w=>ss.includes(w)).length;if(sc>bs){bs=sc;best=s}}));
 return bs>=2?{kind:'sent',c,nm:o.t,label:'в карточке модели',text:oneLine(best).replace(/^\d+\)\s*/,'').slice(0,300)}:{kind:'none',c,nm:o.t,label:'',text:''}}
function factLine(f){if(!f)return'';if(f.kind==='odd')return' Для сравнения, главное в '+f.nm+': '+(f.text.length>150?f.text.slice(0,149).replace(/\s+\S*$/,'')+'…':f.text);if(f.text)return' '+f.nm+', '+f.label+': '+f.text+(/[.!?…]$/.test(f.text)?'':'.');return''}
function bubbleText(q,rv){if(!rv)return SAY[mood];const r=P.res[q.n],ok=r?r.ok:(mood===3||mood===4),f=factFor(q);
 let t=ok?(mood===4?SAY[4]:SAY[3]):SAY[5];
 t+=ok?(q.note?' '+q.note:''):' '+explain(q);
 if(f&&f.kind==='odd'&&!ok)t+=' Эта характеристика не относится к '+f.nm+'.';
 return (t+factLine(f)).replace(/\.{2,}/g,'.')}
function chairReveal(q,rv){if(!rv)return'';const f=factFor(q);if(!f)return'';const c=f.c;
 return`<div class="reveal"><div class="rimg">${c.img?`<img src="${c.img}" alt="${esc(c.name)}">`:''}</div><div class="rtx"><div class="rname">${esc(f.nm)} <span class="mut">· ${esc(c.rows['Цена']||'')} ₽</span></div>${f.text?`<div class="rkey">${f.kind==='odd'?'Для сравнения, главное в модели':'<b>'+esc(f.label.charAt(0).toUpperCase()+f.label.slice(1))+':</b>'} ${esc(f.text)}</div>`:''}<button class="tag" data-c="${c.id}">Полная карточка</button></div></div>`}

const mode0=q=>qmode(q);
function qmode(q){if(q.type==='seq')return'seq';if(q.multi)return'multi';if(q.type!=='single')return'';if(/не относится/i.test(q.q))return'odd';if(/^Клиент/.test(q.q.trim())&&splitQ(q).sit)return'dialog';return''}
function splitQ(q){const t=q.q.trim();if(!t.endsWith('?'))return{sit:t,ask:''};const e=t.length-2,c=Math.max(t.lastIndexOf('. ',e),t.lastIndexOf('» ',e),t.lastIndexOf('! ',e));if(c<1)return{sit:'',ask:t};return{sit:t.slice(0,c+1).trim(),ask:t.slice(c+1).trim()}}

function dialogHead(q){const {sit,ask}=splitQ(q);const m=sit.match(/«([^»]+)»/);let note='',say=sit;if(m){say=m[1];note=(sit.slice(0,m.index)+sit.slice(m.index+m[0].length)).replace(/Клиент\s+\S+\s*:\s*$/,'').replace(/^Клиент\s+\S+\s*:\s*/,'').trim()}
 return`<div class="chat">${note?`<div class="scene">${esc(note)}</div>`:''}<div class="msg"><div class="who">К</div><div class="bb">${esc(say)}</div></div>${ask?`<div class="ask">${esc(ask)}</div>`:''}</div>`}
function dialogTail(q,rv,ed){if(!rv||ed)return'';const r=P.res[q.n],ok=r?r.ok:false,sel=draft.sel[0],o=q.opts.find(x=>x.k===sel);

const sha256=(()=>{const rr=(v,a)=>(v>>>a)|(v<<(32-a));const pr=[];for(let c=2;pr.length<64;c++){if(pr.every(p=>c%p))pr.push(c)}const K=pr.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296)),H0=pr.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296));
return s=>{const b=new TextEncoder().encode(s),l=b.length,N=((l+9+63)>>6)<<6,m=new Uint8Array(N);m.set(b);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(N-4,(l*8)>>>0);dv.setUint32(N-8,Math.floor(l*8/4294967296));const H=H0.slice(),w=new Uint32Array(64);
for(let o=0;o<N;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))>>>0}
let[a,b2,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b2)^(a&c)^(b2&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
[a,b2,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0)}return H.map(v=>v.toString(16).padStart(8,'0')).join('')}})();

function answered(){return (view.queue?draft.done:!!P.res[draft.n])}

 if(!draft||draft.n!==q.n){const r=role==='manager'&&!view.queue&&P.res[q.n];draft={n:q.n,sel:r&&r.a?r.a.sel.slice():[],map:r&&r.a?Object.assign({},r.a.map):{},seq:r&&r.a?r.a.seq.slice():[],show:false,done:false}}

  q.items.map(it=>{const ck=q.pairs.find(p=>p[0]===it.k)[1],v=ed&&rv?ck:(draft.map[it.k]||'');return`<div class="row"><span class="tx"><b>${it.k}.</b> ${esc(it.t)}</span><select data-i="${it.k}" ${rv?'disabled':''}><option value="">—</option>${q.opts.map(o=>`<option ${v===o.k?'selected':''}>${o.k}</option>`).join('')}</select>${rv&&!ed?`<b style="color:${v===ck?'#2e9e5b':'#d9433f'}">${v===ck?'✓':'→ '+ck}</b>`:''}</div>`}).join('')}
 if(q.type==='seq'){const sq=ed&&rv?q.order:draft.seq;body=`<div class="mut" style="margin-bottom:8px">Соберите аргумент по шагам: нажимайте на блоки или перетаскивайте их на нужный шаг. Нажатие на заполненный шаг убирает блок.</div><div>${q.items.map(it=>`<button class="opt" draggable="true" data-s="${it.k}" ${rv||sq.includes(it.k)?'disabled':''} style="${sq.includes(it.k)?'opacity:.35':''}"><span class="kk">${it.k}</span><span>${esc(it.t)}</span></button>`).join('')}</div><h3 style="margin-top:12px">Ваш порядок</h3>`+
  q.items.map((_,i)=>{const k=sq[i],it=q.items.find(x=>x.k===k);const st=rv&&k&&!ed?(k===q.order[i]?'border-color:#2e9e5b':'border-color:#d9433f'):'';return`<div class="slot ${k?'f':''}" data-slot="${i}" style="${st}"><b>Шаг ${i+1}</b> ${it?esc(it.t):'<span class="mut">пусто</span>'}</div>`}).join('')}

 else if(mode==='seq'){body+=(!rv&&draft.seq.length?'<div style="margin-top:8px"><button class="btn" id="seqreset">Сбросить порядок</button></div>':'')+(rv?seqSpeech(q):'')}

function evalQ(q){if((q.type==='single'||q.type==='multi')){const s=draft.sel,tp=s.filter(k=>q.correct.includes(k)).length,fp=s.length-tp;return{s:Math.max(0,(tp-fp)/q.correct.length),ok:tp===q.correct.length&&fp===0}}
 if(q.type==='match'){const c=q.pairs.filter(p=>draft.map[p[0]]===p[1]).length;return{s:c/q.pairs.length,ok:c===q.pairs.length}}
 const c=q.order.filter((k,i)=>draft.seq[i]===k).length;return{s:c/q.order.length,ok:c===q.order.length}}
function ready(q){return (q.type==='single'||q.type==='multi')?draft.sel.length>0:q.type==='match'?q.items.every(i=>draft.map[i.k]):draft.seq.length===q.items.length}
const snap=()=>({sel:draft.sel.slice(),map:Object.assign({},draft.map),seq:draft.seq.slice()});
function submit(){const q=Q.find(x=>x.n===view.n);if(!ready(q)){toastMsg('Сначала выберите ответ');return}const e=evalQ(q),old=P.res[q.n];
 if(view.queue){P.res[q.n]=Object.assign({},old,{s:Math.max(old.s,e.s),ok:old.ok||e.ok,a:snap()});P.xp+=Math.round(50*e.s);draft.done=true}
 else{P.res[q.n]={s:e.s,ok:e.ok,first:e.ok,a:snap()};if(e.ok){P.streak++;P.xp+=100+Math.min(P.streak,5)*10}else{P.streak=0;P.xp+=Math.round(50*e.s)}}
 mood=e.ok?(P.streak>=3&&!view.queue?4:3):5;save();if(e.ok)confetti(P.streak>=3?120:50);render()}
function openQ(n,queue){mood=1;draft=null;view={name:'q',n,queue};render()}
function nextQ(){const q=Q.find(x=>x.n===view.n),qs=LQ(q.level);
 if(view.queue){const i=view.queue.indexOf(q.n);if(i<view.queue.length-1)return openQ(view.queue[i+1],view.queue);return finishLevel(q.level)}
 const i=qs.indexOf(q);if(i<qs.length-1)return openQ(qs[i+1].n);finishLevel(q.level)}
function finishLevel(l){mood=7;draft=null;view=(l===NL&&done(l))?{name:'final'}:{name:'lres',l};confetti(160);render()}
function vLres(){const l=view.l,qs=LQ(l),ok=qs.filter(q=>P.res[q.n].first).length,bad=qs.filter(q=>!P.res[q.n].ok);
 return`<div class="card hero"><div>${av(7)}</div><div><h1>${l>8?'Сравнительный блок':'Уровень '+l} пройден</h1><p class="mut">${esc(LN[l-1])}</p><div class="stars" style="font-size:34px">${'★'.repeat(stars(l))}${'☆'.repeat(3-stars(l))}</div>
 <p id="lsum">С первой попытки верно: <b>${ok}</b> из ${qs.length}. Всего XP: <b>${P.xp}</b>. Ранг: <b>${rank()}</b>.</p>
 ${bad.length?`<p class="mut">Остались ошибки в заданиях: ${bad.map(q=>lbl(q)).join(', ')}.</p><button class="btn" id="fix">Работа над ошибками</button> `:''}
 <button class="btn pri" id="lnext">${l<NL?'Следующий уровень':'К финалу'}</button> <button class="btn" id="toMap">К карте</button></div></div>`}

function vChair(){const c=CH.find(x=>x.id===view.id);
 return`<div class="card"><div class="qhead"><button class="btn" id="bk">← Назад</button><div class="sp"></div><button class="btn" id="x" aria-label="Закрыть">✕</button></div>
 <div class="cd"><div class="ci" style="border-radius:18px">${c.img?`<img src="${c.img}" alt="${esc(c.name)}">`:`<span>${esc(c.name)}<br><small>фото отсутствует</small></span>`}</div>

 <dl class="dl" style="margin-top:16px">${Object.entries(c.rows).filter(([k])=>k!=='Цена'&&k!=='Ключевая характеристика').map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
 ${isEd?(()=>{const rq=Q.filter(q=>related(q).includes(c));return rq.length?`<h3 style="margin-top:16px">Вопросы с этим креслом</h3>${rq.map(q=>`<span class="chip2" data-q="${q.n}">${lbl(q)}</span>`).join('')}`:''})():''}</div>`}

function vGame(){const g=view.game,i=view.i||0,d=PD[g][i%PD[g].length],res=view.gr;let body='';
 if(g==='sil'){const c=CH.find(x=>x.name===d.a);body=`<p class="mut">Узнайте модель по силуэту.</p><img class="gameimg" src="${c.img}" alt="Силуэт кресла"><div class="gameopts">${d.o.map(x=>`<button class="gopt" data-ans="${esc(x)}">${esc(x)}</button>`).join('')}</div>${res||''}`}
 if(g==='match'){body=`<p class="qt">Какая модель соответствует функции: <b>${esc(d.f)}</b>?</p><div class="gameopts">${d.o.map(x=>`<button class="gopt" draggable="true" data-drag="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="drop" id="drop" style="margin-top:14px">Перетащите модель сюда</div>${res||''}`}
 if(g==='dialog'){body=`<div class="bub" style="margin:8px 0">${esc(d.c)}</div><div class="gameopts">${d.o.map(x=>`<button class="gopt" data-ans="${esc(x)}">Предложить ${esc(x)}</button>`).join('')}</div>${res||''}`}
 if(g==='compare'){const A=CH.find(x=>x.name===d.a),B=CH.find(x=>x.name===d.b),ks=[d.k,'Цена','Тип каретки','Управление','Количество программ'];body=`<p class="mut">Сравните модели по ключевым параметрам.</p><div class="compare">${[A,B].map(c=>`<div><div class="ci"><img src="${c.img}" alt="${esc(c.name)}"></div><h3>${esc(c.name)}</h3><dl>${ks.map(k=>`<dt>${esc(k)}</dt><dd>${esc(c.rows[k]||'—')}</dd>`).join('')}</dl></div>`).join('')}</div><div class="bub" style="margin-top:14px">Фокус сравнения: ${esc(d.k)}. ${esc(A.name)} — ${esc(A.rows[d.k]||'—')}; ${esc(B.name)} — ${esc(B.rows[d.k]||'—')}.</div>`}
 return`<div class="card"><div class="qhead"><button class="btn" id="bk">← К практике</button><span class="chip">${g==='sil'?'Узнай кресло':g==='match'?'Соедини функцию':g==='dialog'?'Диалог с клиентом':'Сравни модели'} · ${i+1}/${PD[g].length}</span><div class="sp"></div><button class="btn" id="gnext">Другой раунд →</button></div><div class="qgrid"><div>${av(mood)}</div><div>${body}</div></div></div>`}
function render(){const app=document.getElementById('app'),y=scrollY,key=view.name+(view.n||view.id||view.l||'');let h=topbar();
 if(view.name==='start')h+=vStart();else if(view.name==='map')h+=vMap();else if(view.name==='q')h+=vQ();else if(view.name==='lres')h+=vLres();else if(view.name==='final')h+=vFinal();else if(view.name==='chairs')h+=vChairs();else if(view.name==='lab')h+=vLab();else if(view.name==='game')h+=vGame();else if(view.name==='chair')h+=vChair();
 app.innerHTML='<div class="wrap">'+h+'</div>'+(toast?`<div class="ov"><div class="chip" style="background:#fff;color:#111">${toast}</div></div>`:'');bind();scrollTo(0,key===lastKey?y:0);lastKey=key}
function toastMsg(t){toast=t;render();setTimeout(()=>{toast='';render()},1300)}
const $=(s,f)=>document.querySelectorAll(s).forEach(f);
function bind(){const g=id=>document.getElementById(id);
 g('rM')&&(g('rM').onclick=()=>{role='manager';isEd=false;mood=1;stack=[];view={name:'map'};render()});
 g('eOpen')&&(g('eOpen').onclick=()=>{loginOpen=!loginOpen;loginErr='';render();const x=g('lg');x&&x.focus()});
 g('lf')&&(g('lf').onsubmit=e=>{e.preventDefault();const l=g('lg').value,p=g('pw').value;loginVal=l;if(tryLogin(l,p))enterEd();else{loginErr='Неверный логин или пароль';render();const x=g('pw');x&&x.focus()}});
 g('jump')&&(g('jump').onchange=e=>{if(e.target.value){stack=[];openQ(+e.target.value)}});
 g('nMap')&&(g('nMap').onclick=home);g('nCh')&&(g('nCh').onclick=()=>go({name:'chairs'}));g('nOut')&&(g('nOut').onclick=()=>{if(isEd&&PB){P=PB;PB=null}isEd=false;role=null;stack=[];view={name:'start'};render()});
 g('toMap')&&(g('toMap').onclick=()=>{mood=1;home()});g('bk')&&(g('bk').onclick=back);g('x')&&(g('x').onclick=back);
 g('goOn')&&(g('goOn').onclick=()=>{const f=firstOpen();if(f)openQ(f);else{view={name:'final'};render()}});
 g('rst')&&(g('rst').onclick=()=>{if(confirm('Сбросить весь прогресс?')){P={res:{},xp:0,streak:0,name:P.name};save();render()}});
 $('.lv',b=>b.onclick=()=>{const l=+b.dataset.l;if(!unlocked(l))return;const q=LQ(l).find(q=>!P.res[q.n])||LQ(l)[0];openQ(q.n)});
 $('[data-q]',b=>b.onclick=()=>{if(isEd){stack.push(view);mood=1;draft=null;view={name:'q',n:+b.dataset.q};render()}});
 $('[data-c]',b=>b.onclick=()=>go({name:'chair',id:b.dataset.c}));
 const q=view.name==='q'&&Q.find(x=>x.n===view.n);
 if(q){$('button.opt[data-k]',b=>b.onclick=()=>{const k=b.dataset.k;if(q.multi){const i=draft.sel.indexOf(k);if(i<0){if(q.correct.length>1&&draft.sel.length>=q.correct.length){toastMsg('Нужно выбрать ровно '+q.correct.length);return}draft.sel.push(k)}else draft.sel.splice(i,1)}else{draft.sel=[k];if(!answered()&&(mode0(q)==='dialog'||mode0(q)==='odd')){submit();return}}render()});
  $('select[data-i]',s=>s.onchange=()=>{if(s.value)draft.map[s.dataset.i]=s.value;else delete draft.map[s.dataset.i]});
  $('[data-s]',b=>b.onclick=()=>{draft.seq.push(b.dataset.s);render()});$('[data-slot]',b=>b.onclick=()=>{if(answered())return;const i=+b.dataset.slot;if(draft.seq[i]){draft.seq.splice(i,1);render()}});
  $('[data-s]',b=>{b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.s)});
  $('[data-slot]',b=>{b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();const k=e.dataTransfer.getData('text/plain');if(!k||answered()||draft.seq.includes(k))return;draft.seq.splice(Math.min(+b.dataset.slot,draft.seq.length),0,k);render()}});
  g('seqreset')&&(g('seqreset').onclick=()=>{draft.seq=[];render()});
  g('redoq')&&(g('redoq').onclick=()=>{delete P.res[q.n];draft=null;mood=1;render()});
  g('submit')&&(g('submit').onclick=submit);g('nx')&&(g('nx').onclick=()=>{if(isEd)openQ(q.n+1);else nextQ()});
  g('pv')&&(g('pv').onclick=()=>openQ(q.n-1));g('tg')&&(g('tg').onclick=()=>{draft.show=!draft.show;render()});
  g('redo')&&(g('redo').onclick=()=>{LQ(q.level).forEach(x=>delete P.res[x.n]);P.streak=0;save();openQ(LQ(q.level)[0].n)})}
 g('fix')&&(g('fix').onclick=()=>{const bad=LQ(view.l).filter(q=>!P.res[q.n].ok).map(q=>q.n);openQ(bad[0],bad)});
 g('lnext')&&(g('lnext').onclick=()=>{if(view.l<NL)openQ(LQ(view.l+1)[0].n);else{view={name:'final'};render()}});
 g('pr')&&(g('pr').onclick=()=>window.print());g('nm')&&(g('nm').oninput=e=>{P.name=e.target.value;save();document.getElementById('cn').textContent=P.name||'Менеджер Yamaguchi'});
 g('srch')&&(g('srch').oninput=e=>{const v=e.target.value.toLowerCase();$('#cg .cc',b=>b.style.display=b.dataset.nm.includes(v)?'':'none')})}
document.addEventListener('keydown' ,e=>{if(e.key==='Escape'&&(view.name==='chair'||view.name==='chairs'))back()});
const cv=document.getElementById('cf'),cx=cv.getContext('2d');let pts=[];
function confetti(n){cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<n;i++)pts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:-Math.random()*11-2,c:['#d3182f','#c9a24a','#fff','#222'][i%4],l:90})}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);pts=pts.filter(p=>p.l>0);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,6,9)});requestAnimationFrame(loop)})();
render();
